<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Freelancer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <img src="" alt="">
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="home-wrapper">
                <div class="home-title">
                    <h1>
                        <span class="creative-word">Creative</span>
                        <span class="freelancer-word">Freelancer</span>
                    </h1>
                </div>
                <div class="home-description">
                    <p>
                        I create digital experiences that inspire and engage. With a passion for clean design
                        and innovative solutions, I transform ideas into beautiful, functional realities.
                    </p>
                </div>
                <div class="home-stats">
                    <div class="contents-stats">
                        <span class="stat">150</span>
                        <span>Projects Completed</span>
                    </div>
                    <div class="contents-stats">
                        <span class="stat">5</span>
                        <span>Years experience</span>
                    </div>
                    <div class="contents-stats">
                        <span class="stat">98</span>
                        <span>Happy Clients</span>
                    </div>
                </div>
                <div class="home-bouton">
                    <button class="btn1">View My Work</button>
                    <button class="btn2">Get In Touch</button>
                </div>
                <div class="home-icons">
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#"><i class="fab fa-github"></i></a>
                </div>
            </div>
            <div class="home2-wrapper">
                <div class="skills-wrapper">
                    <div class="skill-item">
                        <span class="skill-dot"></span>
                        <span class="skill-name">UI/UX Design</span>
                    </div>
                    <div class="skill-item">
                        <span class="skill-dot"></span>
                        <span class="skill-name">Development</span>
                    </div>
                    <div class="skill-item">
                        <span class="skill-dot"></span>
                        <span class="skill-name">Creative Ideas</span>
                    </div>
                </div>
                <div class="image-container">
                    <img src="https://bootstrapmade.com/content/demo/Style/assets/img/profile/profile-square-1.webp" alt="home image">
                </div>
            </div>
        </div>
    </main>
    <footer>
    </footer>
</body>
</html>
